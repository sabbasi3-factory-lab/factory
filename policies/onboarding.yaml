# Language onboarding (chrono-node-rs harness/onboard, .github/workflows/onboard.yml). Plain code
# reads this; nothing here is AI-decided. The pipeline onboards the next language of `languages` that
# isn't onboarded yet, one at a time, and stops on the rules below. It decides when a task issue
# closes (a language's last task starts the next one) and hourly. A stop opens a factory:alert
# issue; loosening any rule is the owner's decision (a reviewed PR here).
version: 1
# Owner-approved waves 2-3 (2026-11-04). Finnish first, as the pipeline's proof. Italian and
# Vietnamese last (2026-11-06, owner: "keep running 24/7 until everything has been ported over"):
# chrono-node-rs harness/onboard/hints.yaml covers the three steps the generator used to refuse
# (trace-checked seeds for ITMergeRelativeAfterDateRefiner; ITUnlikelyFormatFilter and
# VIMergeWeekdayComponentRefiner verified unreachable, ported against unit cases). Until that
# generator change is pinned on main, onboarding them fails closed in the generate job.
# vi ported outside the factory as an A/B experiment (owner, 2026-11-09).
# it is the factory v2 pilot (owner, 2026-11-09).
languages: [fi, id, nl, ru, uk, ar, zh-hans, zh-hant]
# vi ported outside the factory as an A/B experiment (owner, 2026-11-09). An external locale may be
# generated on main (its oracle, golden cases and code, so CI checks it), but the factory never runs
# it: no onboarding decision picks it, no task issues are created for it, the controller dispatches
# nothing for it, and the onboarding stop rules and in-flight count leave it out.
# it is the factory v2 pilot (owner, 2026-11-09).
external_locales: [vi, it]
# A language with open task issues counts as in flight, and so does one with a contract that has no
# task issue yet (past 2 h after its onboarding PR merged, that stops: alert).
# 5 (was 1): the owner's decision of 2026-11-09 ("take that guardrail out"). It covers every language
# left (ar, zh-hans, zh-hant, it at the time), so it never binds; onboarding PRs still go one at a time, at
# most tiers.yaml onboarding.max_per_day a day, and the stop rules below are unchanged.
max_languages_in_flight: 5
stop:
  # AI Credits spent by all agent runs (implement, repair, triage, review) on generated locales'
  # tasks: each run's full cost (agent, threat detection, evals) from the controller's audit log
  # (run_spend). Waves 2-3 total.
  budget_aic: 10000
  # First-try merges / merged tasks of generated locales (first try: one implement run, no repair,
  # PR merged zero-touch: no comment, review or commit by a person), once at least min_sample tasks
  # merged.
  min_first_try_merge_rate: 0.8
  min_sample: 5
  # Open needs-human task issues of generated locales (a cluster).
  max_open_needs_human: 2
