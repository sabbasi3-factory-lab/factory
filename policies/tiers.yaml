# Risk tiers for chrono-node-rs. Paths are globs relative to the product repo root.
version: 1
tiers:
  auto:            # merge queue after the standard gates
    paths:
      - "src/locales/*/parsers/**"
      - "src/locales/*/refiners/**"
      - "tests/locales/**"
  auto-strict:     # merge queue after the standard gates plus the strict gates
    paths:
      - "src/core/**"
      - "src/calculation/**"
      - "src/common/**"
      - "Cargo.toml"     # only through the dependency steward's PRs
      - "Cargo.lock"
      - "vendor/**"
    strict_gates:
      - full_regression           # golden + held-out comparison across every ported language
      - semver_checks             # no public API break
      - mutation_score_not_lower
      - perf_regression_max_pct: 5
      - code_health_not_worse     # complexity, duplication
      - reviewer_agent            # second-opinion model; "object" -> needs-human, never overrides a gate
      - serialize_area: true      # one core PR at a time
      - auto_revert_on_regression: true
    strict_gates_params:
      # mutation_score_not_lower compares the change's mutation score with main's on the lines it
      # replaced. Code that replaces nothing (new files, pure additions) has nothing to compare
      # with, so it must reach this score instead (caught + timeout) / viable. Owner-set (2026-10-26).
      mutation_floor_new_files: 0.8
  human:           # owner review
    paths:
      - ".github/**"
      - "contracts/**"
      - "harness/**"
      - "tests/golden/**"
      - "upstream/**"
      - "NOTICE"
protected_from_agents:   # agents' changes to these paths are rejected outright
  - ".github/**"
  - "contracts/**"
  - "upstream/**"
  - "tests/golden/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - "vendor/**"
