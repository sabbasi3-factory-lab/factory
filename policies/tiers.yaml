# Risk tiers for chrono-node-rs. Paths are globs relative to the product repo root.
version: 1
tiers:
  auto:            # merge queue after the standard gates
    paths:
      - "src/locales/*/parsers/**"
      - "src/locales/*/refiners/**"
      - "tests/locales/**"
      # Generated locales' constants (chrono-node-rs harness/onboard): acceptance is unit cases
      # recorded from the pinned chrono-node, the same oracle as the goldens, and every step that
      # imports it is golden-gated. Coordinator decision 2026-11-04 under the owner's goal
      # ("automate as much as we can ... with good quality checks and guardrails"); pending owner review.
      - "src/locales/*/constants.rs"
  auto-strict:     # merge queue after the standard gates plus the strict gates
    paths:
      - "src/core/**"
      - "src/calculation/**"
      - "src/common/**"
      - "Cargo.toml"     # only through the dependency steward's PRs
      - "Cargo.lock"
      - "vendor/**"
      # A generated locale's shared parser base: every parser of that locale depends on it, so it
      # gets the strict gates, the reviewer and auto-revert. Coordinator decision 2026-11-04 (as above);
      # pending owner review. Note: the controller's strict lane is factory-wide (one auto-strict task in
      # flight at a time), so these serialize with core work and across languages.
      - "src/locales/*/abstract_*.rs"
    strict_gates:
      - full_regression           # golden + held-out comparison across every ported language
      - semver_checks             # no public API break
      - mutation_score_not_lower
      - perf_regression_max_pct: 5
      - code_health_not_worse     # complexity, duplication
      - reviewer_agent            # second-opinion model; "object" -> needs-human, never overrides a gate
      - serialize_area: true      # one core PR at a time
      - auto_revert_on_regression: true
    strict_gates_params:
      # mutation_score_not_lower compares the change's mutation score with main's on the lines it
      # replaced. Code that replaces nothing (new files, pure additions) has nothing to compare
      # with, so it must reach this score instead (caught + timeout) / viable. Owner-set (2026-10-26).
      mutation_floor_new_files: 0.8
  human:           # owner review
    paths:
      - ".github/**"
      - "contracts/**"
      - "harness/**"
      - "tests/golden/**"
      - "upstream/**"
      - "NOTICE"
# Bug-intake fix PRs (chrono-node-rs harness/feedback): when the monitor or a person with write
# access reports a phrase where the port and the pinned chrono-node disagree, the intake opens a PR
# that ADDS a fix case (chrono-node's own output) and its generated fix contract. The controller
# queues it without the owner only if every one of these holds (otherwise needs-human):
#   - opened by the controller App, on branch factory/intake/<lang>-fix-<hash>;
#   - it only adds exactly contracts/<lang>/fix-<hash>.yaml, harness/golden/fixes/<lang>-fix-<hash>.json
#     and tests/golden/fixes/<lang>-fix-<hash>.json (no edit, delete or rename of anything);
#   - ci passes, which regenerates the case through the pinned chrono-node byte for byte
#     (the oracle, not the reporter) and checks the contract against the seed script; gates pass;
#   - fewer than max_per_day intake fixes merged or were queued today (UTC).
# A report claiming chrono-node itself is wrong is never automatic: it goes to the owner.
# Owner-approved 2026-11-04 ("intake fix PRs merge without the owner's approval").
intake_fixes:
  auto_merge: true
  max_per_day: 3

# Generated language-onboarding PRs (chrono-node-rs harness/onboard, onboard.yml): the generator's
# output for one owner-approved language (onboarding.yaml), nothing else, every file regenerated byte
# for byte in CI from the pinned chrono-node. The controller queues one without the owner when its
# files are exactly that output, ci and gates are green, and fewer than max_per_day merged or were
# queued today (UTC); otherwise the owner decides. Coordinator decision 2026-11-04 under the owner's
# goal ("automate as much as we can ... with good quality checks and guardrails"); pending owner review.
onboarding:
  auto_merge: true
  max_per_day: 1

protected_from_agents:   # agents' changes to these paths are rejected outright
  - ".github/**"
  - "contracts/**"
  - "upstream/**"
  - "tests/golden/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - "vendor/**"
