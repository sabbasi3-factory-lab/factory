# AI Credits (AIC). gh-aw's unit: 1 AIC = $0.01 USD, estimated from public model prices.
# Actual billing goes through the owner's Copilot seat.
version: 1
per_run:                  # gh-aw frontmatter max-ai-credits
  implement: 500
  repair: 300
  reviewer_agent: 200
  factory_review: 500
  # needs-human pre-triage (chrono-node-rs triage.md): read-only, one advisory comment per hand-off.
  # Present = on (the controller dispatches it and counts it); absent = off. Coordinator decision
  # 2026-11-04, pending owner review. A run is reserved at 150 + threat_detection + 2 x margin.
  needs_human_triage: 150
  threat_detection: 400   # gh-aw default; pinned in each workflow's safe-outputs.threat-detection
  # max-ai-credits is NOT a strict hard stop. It's "stop after the response that crosses the cap":
  # gh-aw's firewall checks the total already recorded before each request
  # (github/gh-aw-firewall v0.28.57, containers/api-proxy/guards/ai-credits-guard.js L497-516,
  # `maxExceeded: roundedTotalAiCredits >= config.max`), so the response admitted just under the
  # cap is billed in full, and requests in flight together can each overshoot. The controller
  # counts a completed run whose usage is unreadable at
  #   its caps + one overshoot_margin per AI job: repair and review cap + threat_detection + 2 x margin
  #   (agent + detection job); implement 500 + 400 + 500 + 3 x margin = 2600 (agent + detection + evals:
  #   gh-aw v1.0.1's evals job inherits max-ai-credits; chrono-node-rs #207, 2026-11-04)
  # and reverts to "unknown" (blocks, and raises factory:alert) if a readable run ever shows more
  # concurrency or a larger single response than assumed here, or can't be checked. Owner-set 2026-10-26.
  # Where the margin applies (coordinator decision B1, 2026-10-26):
  #   - the DAILY total (factory_per_day): runs in flight are reserved at that bound,
  #     and the fallback bound above uses it too: the worst case;
  #   - the PER-TASK repair gate (per_task.max_aic) does NOT: it counts a repair at its caps
  #     (repair + threat_detection), an expected-cost guard. With the margin a repair's worst case
  #     (1500) would exceed per_task.max_aic (1000) and no repair could ever run.
  overshoot_margin: 400                     # per AI job = max response x max concurrency
  overshoot_assumed_max_response_aic: 100   # ~10x the largest seen (10.14 AIC, Oct 2026, 68 responses)
  overshoot_assumed_max_concurrency: 4      # 4x the largest seen (1); nothing in gh-aw caps it
per_workflow_per_day:     # gh-aw frontmatter max-daily-ai-credits
  implement: 6000         # owner raised 3000 -> 6000 on 2026-11-04 (wave 1 at WIP 5)
  repair: 1500
  reviewer_agent: 1000
  factory_review: 1000
  needs_human_triage: 600   # 4 triages a day at the per-run cap; gh-aw max-daily-ai-credits
per_task:
  max_aic: 1000           # all attempts, repairs and detection for one task
factory_per_day:          # enforced by the controller across all workflows
  # Owner raised 10000 -> 20000 on 2026-11-04 ("okay feel free to increase the WIP to 5 or higher.
  # and the daily cap"). This total counts in-flight runs at their bound (5 implements = 13000),
  # so 10000 would pause dispatch before much real spend. The per-workflow daily caps above add
  # up to 9500 (6000 + 1500 + 1000 + 1000), but they are admission thresholds, not a hard ceiling
  # on billed spend: gh-aw checks completed usage when a run starts, so runs already in flight can
  # finish above them, and each response can overshoot its per-run cap (overshoot_margin).
  max_aic: 20000
  alert_at_pct: 80
  pause_at_pct: 100
